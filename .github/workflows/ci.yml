name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sachin001234/vllm-platform

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run CI tests
        run: pytest -v -m "not integration"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VLLM_GITOPS_TOKEN: ${{ secrets.VLLM_GITOPS_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${VLLM_GITOPS_TOKEN}@github.com/Sachin001234/vllm-gitops.git gitops

          cd gitops

          sed -i "s|image: ghcr.io/sachin001234/vllm-platform:.*|image: ghcr.io/sachin001234/vllm-platform:${IMAGE_TAG}|" base/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add base/deployment.yaml
          git commit -m "Update vLLM image to ${IMAGE_TAG}"
          git push origin main
